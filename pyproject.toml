[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duksan-lstm-ae"
version = "0.1.0"
description = "LSTM Autoencoder anomaly detection for Duksan equipment sensors"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.20",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "scikit-learn>=1.4",
  "streamlit>=1.35",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
